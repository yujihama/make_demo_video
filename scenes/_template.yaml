# シーン定義のひな形。コピーして scenes/<id>.yaml として使う。
# 全項目の定義は demo/scene.schema.json。値の単位は ms（ミリ秒）、review だけ秒。

id: my_scene                       # 必須。出力フォルダ名（英小文字・数字・_-）
title: 画面の説明                   # 必須。人が読むための題名
lang: ja                           # 字幕の元の言語。他の言語は bin/demo translate で scenes/<id>.<lang>.yaml を作る
url: http://localhost:8080          # 必須。撮影開始時に開く URL
mode: browser                      # browser（既定）| desktop（open_download を使うとき）
cursor: ghost                      # ghost（既定・描画カーソル）| smooth | none。desktop では無視（実カーソル）
zoom: 1.5                          # 画面の拡大率（CSS zoom）。1920x1080 で文字を読ませたいとき 1.25〜1.5
seed: 42                           # smooth カーソルの軌跡を固定する乱数の種
viewport: {width: 1920, height: 1080}   # 録画サイズ（browser モード）
pace:
  before_action: 400               # カーソル到着から操作までの間
  after_action: 800                # 操作後に画面を見せる間

style:                             # 演出（後工程）。省略すると rich の自動演出（README 4.4）
  effects: rich                    # rich | simple（焼き込み字幕だけ）
  accent: "#FFB020"                # 強調色（強調語・波紋・枠・進捗）
  max_zoom: 1.6                    # カメラの最大拡大率
  caption_label: true              # 字幕の左に章名を出す
  speed_badge: true                # 早送り中に「早送り ×N」を出す
  intro: {subtitle: 補足の一文}     # 冒頭のタイトルカード。false で無し
  outro: true                      # 末尾のまとめカード。false で無し
  reading_cps: 7                   # 字幕を読む速さ（字/秒）。省略時は言語ごと（ja 7、en 15）
  guide:                           # 常時ガイド（README 4.9）。false で両方消す
    breadcrumb: true               #   右上に「シーン名 › 章名」（通し版では先頭に 1/2）
    progress_bar: true             #   下端に全体の進行バーと章・シーンの区切り
    position: top-right            #   top-right | top-left

review:                            # 合格判定の基準（bin/demo review / loop が使う）
  min_duration: 10                 # 完成動画の長さの下限（秒）
  max_duration: 90                 # 上限（秒）
  max_freeze: 4                    # 画面が止まっている区間の最長（秒）
  expect_text:                     # name を付けたステップの時点で画面に出ているべき文字列
    - {after: done, text: 完了しました}

steps:                             # 上から順に実行する。1ステップ1キー
  - chapter:                       # 章カードを全画面に出す（章の区切りにもなる）
      title: 章の題名
      description: 補足の一文
      duration: 2200

  - click:                         # クリック
      testid: some-button          # 対象の data-testid（必須）
      caption: "**強調したい語**を含む字幕"   # 任意。**…** は強調色の太字。無ければ数値（8件・100万円）を自動で強調
      hold: 500                    # 任意。操作後に追加で見せる時間
      effect:                      # 任意。自動で決まる演出の上書き
        zoom: focus                # focus（寄る）| fit（全体が収まる）| out（引く）| 1.3 など数値 | false
        ripple: true               # クリックの波紋

  - type:                          # 入力欄をクリックして文字を打つ（入力中の文字が左下に出る）
      testid: text-input
      text: 入力する文字
      effect: {keys: true}         # キー表示（既定 true）

  - upload:                        # ファイル選択。ネイティブのダイアログは出ない
      testid: file-input
      file: ../sample-app/sample/expense_2026Q3.csv   # このYAMLからの相対パス

  - wait_for:                      # 画面に文字が出るまで待つ（処理待ち。後工程で自動的に早送り）
      testid: status
      text: 完了しました
      timeout: 20000               # これを過ぎたら失敗
      duration: 6000               # 早く終わってもこの長さまで待つ → 毎回同じタイムラインになる
      name: done                   # review.expect_text から参照する名前

  - hover:                         # カーソルを載せて見せる（既定でスポットライト）
      testid: result-table
      hold: 2000
      effect:
        callout: 指摘あり          # スポットライトに添える吹き出し
        countup: {to: 6, label: 指摘, suffix: 件}   # 数値を 0 から数え上げる大きな吹き出し

  - download:                      # クリックしてダウンロード（out/<id>/run/downloads/ に保存。保存通知が自動で出る）
      testid: download-button
      effect: {toast: 結果をExcelで保存しました}   # 通知の文を変える（既定はファイル名入り）

  # - open_download:               # desktop モード専用。直前のダウンロードを Calc で開いて見せる
  #     hold: 2500

  - compare:                       # 導入前後の比較カード（全画面。rich のみ）
      title: 導入効果
      before: {label: これまで, value: 3日, note: 担当者が目視で確認}
      after: {label: 導入後, value: 5分, note: 全件を自動で点検}
      duration: 3800

  - pause: 1000                    # 何もせず待つ
